                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">PRODUTOS</a>
                        </li>
                        <li class="nav-item">

                        </li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">

                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>

    <main class="d-flex flex-column align-items-center" style="justify-content: flex-start; min-height: 100vh; padding-top: 20px; width: 100%;">
         <div id="busca-produtos" style="width: 100%; display: flex; justify-content: center; margin-bottom: 20px;">
            <form style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 15px; white-space: nowrap; background-color: #ffffff; width: 100%; max-width: 900px; padding: 15px 25px; border-radius: 8px; box-sizing: border-box;">
                
                <label for="busca" style="margin: 0; line-height: 1;">Buscar:</label>
                <input type="text" id="input-busca" class="input_texto" style="width: 280px; height: 38px; padding: 6px 12px; margin: 0; box-sizing: border-box; vertical-align: middle;">
                
                <label for="ordem" style="margin: 0; line-height: 1;">Ordenar por:</label>
                <select id="select-ordem" name="ordem" style="width: 160px; height: 38px; padding: 6px 12px; margin: 0; box-sizing: border-box; vertical-align: middle;">
                    <option value="">Sem ordenação</option>
                    <option value="menor preco">Menor preço</option>
                    <option value="maior preco">Maior preço</option>
                </select>
                
                <input type="button" value="Buscar" onclick="carregar_produtos(true)" class="btn_enviar" style="height: 38px; padding: 0 20px; margin: 0; cursor: pointer; box-sizing: border-box; vertical-align: middle;">
                
            </form>
        </div>

        <div id="produtos" style="width: 100%;"></div>
    </main>
    <!-- ALERTA TOAST -->

            <div class="d-flex">

                    Mensagem
                </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>
